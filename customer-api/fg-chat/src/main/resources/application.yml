server:
  port: 9080
  servlet:
    context-path: /chat-api
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

spring:
  profiles:
    default: base,cp

logging:
  level:
    com.chat: warn
    org.springframework: warn
    com.xy.common.client.WuKongClient: DEBUG
    com.xy.common.client: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet.mvc.method.annotation: DEBUG

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:9070}
  assistant:
    uid: ${AI_ASSISTANT_UID:fg_ai}

feign:
  client:
    config:
      wukongClient:
        loggerLevel: full
      default:
        loggerLevel: full

# JWT 配置
jwt:
  header: token
  secret: ${TOKEN_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000
  prefix:

# xy-ai 配置
xy-ai:
  apiKey: ${XY_AI_API_KEY}
  secret: ${XY_AI_SECRET}

# 论坛业务配置
forum:
  # 发帖限流：同一用户 5 分钟最多 3 篇
  post-limit-per-user: 3
  post-limit-window-minutes: 5
  # 评论限流：同一用户 1 分钟最多 10 条
  comment-limit-per-user: 10
  comment-limit-window-minutes: 1
  # 搜索限流：同一 IP 1 分钟最多 30 次
  search-limit-per-ip: 30
  search-limit-window-minutes: 1

# 音视频通话配置（媒体面走 LiveKit SFU，呼叫控制信令走悟空 IM 个人频道）
xy:
  rtc:
    # 呼叫超时（秒）：超时未接听自动结束并通知双方
    call-timeout-seconds: 90
    # 通话人数上限（1v1 固定 2 人，群聊取该值）
    max-participants: 9
    # 单次通话最长时长（分钟），超时由定时任务兜底结束
    max-call-minutes: 180
    # LiveKit SFU
    livekit:
      # 下发给前端的地址（生产使用 wss:// 并由 Nginx 反代）
      url: ${LIVEKIT_URL:ws://127.0.0.1:7880}
      # 服务端 RoomService 调用地址（通常为内网）
      api-url: ${LIVEKIT_API_URL:http://127.0.0.1:7880}
      api-key: ${LIVEKIT_API_KEY:devkey}
      api-secret: ${LIVEKIT_API_SECRET:secret}
      # 接入 token 有效期（秒）
      token-ttl-seconds: 14400
      # 房间空置自动关闭（秒）
      empty-timeout-seconds: 300
      # 参与者掉线宽限（秒）
      departure-timeout-seconds: 20