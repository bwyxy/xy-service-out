server:
  port: 9080
  servlet:
    context-path: /chat-api
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

spring:
  profiles:
    default: base,cp

logging:
  level:
    com.chat: warn
    org.springframework: warn
    com.xy.common.client.WuKongClient: DEBUG
    com.xy.common.client: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet.mvc.method.annotation: DEBUG

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:9070}
  assistant:
    uid: ${AI_ASSISTANT_UID:fg_ai}

feign:
  client:
    config:
      wukongClient:
        loggerLevel: full
      default:
        loggerLevel: full

# JWT 配置
jwt:
  header: token
  secret: ${TOKEN_SECRET}
  expiration: 86400000
  refresh-expiration: 604800000
  prefix:

# xy-ai 配置
xy-ai:
  apiKey: ${XY_AI_API_KEY}
  secret: ${XY_AI_SECRET}

# 论坛业务配置
forum:
  # 发帖限流：同一用户 5 分钟最多 3 篇
  post-limit-per-user: 3
  post-limit-window-minutes: 5
  # 评论限流：同一用户 1 分钟最多 10 条
  comment-limit-per-user: 10
  comment-limit-window-minutes: 1
  # 搜索限流：同一 IP 1 分钟最多 30 次
  search-limit-per-ip: 30
  search-limit-window-minutes: 1

# 音视频通话（WebRTC）配置
xy:
  rtc:
    # 呼叫超时（秒）：超时未接听自动结束并通知双方
    call-timeout-seconds: 90
    # ICE 服务器（STUN/TURN），生产环境建议自建 coturn 并补充 turn 配置
    ice-servers:
      - urls: stun:stun.l.google.com:19302
      # - urls: turn:turn.example.com:3478
      #   username: your-username
      #   credential: your-credential