version: '3.7'
services:
  wukongim: # WuKongIM服务
    image: registry.cn-shanghai.aliyuncs.com/wukongim/wukongim:v2
    environment:
      - "WK_MODE=release"
      
      - "WK_CLUSTER_NODEID=1001"
      # - "WK_TOKENAUTHON=true"  # 开启token认证，生产环境强烈建议开启
      - "WK_CLUSTER_SERVERADDR=${WK_EXTERNAL_IP}:11110" # 节点内部通信请求地址
      - "WK_TRACE_PROMETHEUSAPIURL=http://prometheus:9090" # prometheus监控地址
      - "WK_EXTERNAL_IP=${WK_EXTERNAL_IP}" # 服务器外网ip
      - "WK_EXTERNAL_WSSADDR=wss://${WK_EXTERNAL_DOMAIN}/wk/ws/"
      - "WK_CLUSTER_APIURL=http://${WK_EXTERNAL_IP}:5001" # api的内网地址
      - "WK_INTRANET_TCPADDR=${WK_EXTERNAL_IP}:5100" # tcp连接的内网地址，此配置主要用于压测
      
      # SSL 配置
    #   - "WK_WSSCONFIG_CERTFILE=/www/IMServer/wukongim/cfg/your_domain_bundle.crt"
    #   - "WK_WSSCONFIG_KEYFILE=/www/IMServer/wukongim/cfg/your_domain.key"
    healthcheck:
      test: "wget -q -Y off -O /dev/null http://localhost:5001/health > /dev/null 2>&1"
      interval: 10s
      timeout: 10s
      retries: 3
    restart: always
    volumes:
      - ./wukongim_data:/root/wukongim # 数据挂载到物理机的目录
      - ./wk.yaml:/www/IMServer/wukongim/wk.yaml
    ports:
      - 5001:5001 # http api 端口
      - 5100:5100 # tcp端口
      - 5200:5200 # websocket端口
      - 5300:5300 # 管理端端口
      - 5172:5172 # demo端口
      - 11110:11110 # 分布式节点通讯端口
  prometheus:  # 监控服务
    image: registry.cn-shanghai.aliyuncs.com/wukongim/prometheus:v2.53.1
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"