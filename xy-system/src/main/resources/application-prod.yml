# ===========================================
# 生产环境配置
# ===========================================
server:
  port: 8180
  servlet:
    context-path: /prod-api
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

spring:
  devtools:
    restart:
      enabled: false

# 日志配置 (生产环境只输出 warn)
logging:
  level:
    com.todo: warn
    org.springframework: warn

# JWT 配置
jwt:
  header: authorization
  secret: ${TOKEN_SECRET:xy-jwt-secret-key-at-least-32-bytes}
  expiration: 86400000
  refresh-expiration: 604800000
  prefix: Bearer

# Token 配置
token:
  header: Authorization
  secret: ${TOKEN_SECRET}
  expireTime: ${TOKEN_EXPIRE_TIME:1440}

# 微信小程序配置
wechat:
  appid: ${WECHAT_APPID}
  secret: ${WECHAT_SECRET}