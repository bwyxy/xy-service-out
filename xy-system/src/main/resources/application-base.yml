# ===========================================
# 基础共享配置 (所有环境共用)
# ===========================================

# 项目相关配置
site-manager:
  name: site
  version: 1.0.0
  copyrightYear: 2026
  addressEnabled: false

# 用户配置
user:
  password:
    maxRetryCount: 5
    lockTime: 10

spring:
  security:
    user:
      password: 123456
      name: admin
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  messages:
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis-plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.todo.**.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# Swagger 配置
swagger:
  enabled: true

# Token 失效时间
losetoken:
  loseTime: 30
  loseType: hours

# 加密密钥
encrypt:
  key: ${AES_KEY}

# 七牛云
qiniu:
  accessKey: ${QINIU_ACCESS_KEY}
  secretKey: ${QINIU_SECRET_KEY}
  bucket: ${QINIU_BUCKET}
  domain: ${QINIU_DOMAIN}
  region: ${QINIU_REGION:huanan}

# 博客多平台分发
dispatch:
  # 定时任务总开关
  scheduler:
    enabled: true
  # 平台凭证加密密钥，未单独配置时复用项目统一的 AES_KEY
  credential:
    key: ${DISPATCH_AES_KEY:${AES_KEY:}}
  # 自己博客的站点地址前缀，用于回传原文地址（留空则不下发原文链接）
  article-url-prefix: https://xiaee.cn
  # 待分发任务兜底扫描
  scan:
    interval-ms: 30000
    batch-size: 50
  # 瞬时异常失败任务的自动重试
  retry:
    interval-ms: 60000
  # 平台运营数据采集时间
  stat:
    cron: 0 0 2 * * ?