# ===========================================
# 基础共享配置 (所有环境共用)
# ===========================================

# 项目相关配置
site-manager:
  name: site
  version: 1.0.0
  copyrightYear: 2026
  addressEnabled: false

# 用户配置
user:
  password:
    maxRetryCount: 5
    lockTime: 10

spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  messages:
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis-plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.todo.**.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# Swagger 配置
swagger:
  enabled: true

# Token 失效时间
losetoken:
  loseTime: 30
  loseType: hours