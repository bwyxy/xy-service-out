# ===========================================
# 平台公共配置 (cp = common platform)
# ===========================================
xy:
  wk-api-url: ${WK_API_URL}

ai:
  embedding:
    # 支持独立配置 Embedding Key/Endpoint/Model；未配置时默认复用 OPENAI_* 保持兼容
    api-key: ${EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
    base-url: ${EMBEDDING_BASE_URL:${OPENAI_BASE_URL:}}
    model: ${EMBEDDING_MODEL:${OPENAI_MODEL:}}

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    druid:
      initialSize: 5
      minIdle: 10
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1 FROM DUAL
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: true
      statViewServlet:
        enabled: true
        allow:
        url-pattern: /druid/*
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# MyBatis 配置
mybatis:
  typeAliasesPackage: com.todo.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

# 验证码配置
captcha:
  email:
    expire-time: 300 # 验证码有效期 5分钟

# 邮箱配置
email:
  username: ${EMAIL_USERNAME}
  password: ${EMAIL_PASSWORD}
  host: smtp.qq.com
  port: 465