# ===========================================
# 开发环境配置
# ===========================================
server:
  port: 9100

spring:
  devtools:
    restart:
      enabled: true

# 日志配置
logging:
  level:
    com.todo: debug
    org.springframework: warn

# Mybatis-plus SQL 日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Token 配置
token:
  header: Authorization
  secret: ${TOKEN_SECRET:siteManager}
  expireTime: ${TOKEN_EXPIRE_TIME:1440}

# 七牛云
qiniu:
  accessKey: ${QINIU_ACCESS_KEY:}
  secretKey: ${QINIU_SECRET_KEY:}
  bucket: ${QINIU_BUCKET:}
  domain: ${QINIU_DOMAIN:}
  region: ${QINIU_REGION:huanan}

# 微信小程序配置
wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}