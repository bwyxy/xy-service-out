# ===========================================
# 开发环境配置
# ===========================================
server:
  port: 9090

spring:
  devtools:
    restart:
      enabled: true

# 日志配置
logging:
  level:
    com.todo: debug
    org.springframework: warn

# Mybatis-plus SQL 日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  header: authorization
  secret: ${TOKEN_SECRET:xy-jwt-secret-key-at-least-32-bytes}
  expiration: 86400000
  refresh-expiration: 604800000
  prefix: Bearer

# Token 配置
token:
  header: authorization
  secret: ${TOKEN_SECRET:siteManager}
  expireTime: ${TOKEN_EXPIRE_TIME:1440}

# 七牛云
qiniu:
  accessKey: ${QINIU_ACCESS_KEY:}
  secretKey: ${QINIU_SECRET_KEY:}
  bucket: ${QINIU_BUCKET:}
  domain: ${QINIU_DOMAIN:}
  region: ${QINIU_REGION:huanan}

# 微信小程序配置
wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}

ai:
  service:
    internal-api-key: xyai_211shCqYCXaYEmbabzCWnmXl

